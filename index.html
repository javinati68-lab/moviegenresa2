            display: inline-flex;
            min-width: 60px;
            min-height: 30px;
            border-bottom: 2px dashed #64748b;
            padding: 0 5px;

            .shiny-border { border: 1px solid #000 !important; box-shadow: none !important; }
            canvas { max-width: 100% !important; }
        }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: #f8fafc;
            padding: 1rem 2rem;
            border-radius: 9999px;
            z-index: 9999;

            pointer-events: none;
            transition: opacity 0.3s;

        }
        .dark select option {
            background-color: #1e293b;
            color: #f8fafc;
        }

</head>

                div.draggable = true;
                div.dataset.index = idx;
                div.dataset.correctId = p.id;
                
                div.addEventListener('dragstart', handlePuzzleDragStart);
                div.addEventListener('dragover', handlePuzzleDragOver);
                div.addEventListener('drop', handlePuzzleDrop);
                div.addEventListener('dragenter', (e) => e.target.classList.add('drag-over'));
                div.addEventListener('dragleave', (e) => e.target.classList.remove('drag-over'));
                
                grid.appendChild(div);
            });
            startPuzzle();
        };

        let draggedPuzzlePiece = null;
        function handlePuzzleDragStart(e) { draggedPuzzlePiece = this; }
        function handlePuzzleDragOver(e) { e.preventDefault(); }
        function handlePuzzleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            if (draggedPuzzlePiece !== this) {
                const tempPos = this.style.backgroundPosition;
                const tempId = this.dataset.correctId;
                
                this.style.backgroundPosition = draggedPuzzlePiece.style.backgroundPosition;
                this.dataset.correctId = draggedPuzzlePiece.dataset.correctId;
                
                draggedPuzzlePiece.style.backgroundPosition = tempPos;
                draggedPuzzlePiece.dataset.correctId = tempId;
                
                checkPuzzle();
            }
        }

        const startPuzzle = () => {
            if(!puzzleTimerInterval) {
                puzzleTimerInterval = setInterval(() => {
                    puzzleSeconds++;
                    let m = Math.floor(puzzleSeconds/60).toString().padStart(2, '0');
                    let s = (puzzleSeconds%60).toString().padStart(2, '0');
                    const timerEl = document.getElementById('puzzle-timer');
                    if(timerEl) timerEl.innerText = `${m}:${s}`;
                }, 1000);
            }
        };

        const checkPuzzle = () => {
            const pieces = document.querySelectorAll('.puzzle-piece');
            let isCorrect = true;
            pieces.forEach((p, i) => {
                if(parseInt(p.dataset.correctId) !== i) isCorrect = false;
            });
            if(isCorrect) {
                clearInterval(puzzleTimerInterval);
                showToast(`Puzzle solved in ${document.getElementById('puzzle-timer').innerText}!`);
                pieces.forEach(p => { p.draggable = false; p.style.border = 'none'; p.style.cursor = 'default'; });
            }
        };

        const markElement = (el, isCorrect) => {
            el.disabled = true;
            el.classList.remove('shiny-border');
            if(isCorrect) el.classList.add('correct-input');
            else el.classList.add('incorrect-input');
        };

        const checkAnswers = (actNum) => {
            let score = 0;
            let total = 0;

            const btn = document.getElementById(`check-btn-${actNum}`);
            if(btn) btn.disabled = true;

            switch(actNum) {
                case 1:
                    const n = document.getElementById('act1-notes');
                    if(n.value.trim().length > 10) { score=1; total=1; markElement(n, true); }
                    else { total=1; markElement(n, false); showToast("Notes are too short."); }
                    break;
                case 2:
                    let isPuzCorrect = true;
                    document.querySelectorAll('.puzzle-piece').forEach((p, i) => {
                        if(parseInt(p.dataset.correctId) !== i) isPuzCorrect = false;
                        p.draggable = false;
                    });
                    total = 1; score = isPuzCorrect ? 1 : 0;
                    if(!isPuzCorrect) showToast("Puzzle is not completely solved.");
                    clearInterval(puzzleTimerInterval);
                    break;
                case 3:
                    total = 3;
                    document.querySelectorAll('.act3-input').forEach(ta => {
                        if(ta.value.trim().length > 3) { score++; markElement(ta, true); }
                        else markElement(ta, false);
                    });
                    break;
                case 4:
                    total = data.act4.length;
                    document.querySelectorAll('.act4-input').forEach((inp, i) => {
                        let userAns = inp.value.trim().toLowerCase().replace(/[.,]/g,'');
                        let correctAns = data.act4[i].ans.toLowerCase().replace(/[.,]/g,'');
                        if(userAns === correctAns) { score++; markElement(inp, true); }
                        else {
                            markElement(inp, false);
                            inp.value = `${inp.value} (Correct: ${data.act4[i].ans})`;
                        }
                    });
                    break;
                case 5:
                    total = data.act5.personA.length;
                    const bLines = data.act5.personB;
                    document.querySelectorAll('.act5-select').forEach((sel, i) => {
                        if(sel.value === bLines[i]) { score++; markElement(sel, true); }
                        else markElement(sel, false);
                    });
                    break;
                case 6:
                    score=1; total=1; 
                    break;
                case 7:
                    total = data.act7.length;
                    document.querySelectorAll('.sentence-dropzone').forEach((dz, i) => {
                        let userStr = Array.from(dz.children).filter(c=>!c.classList.contains('drop-hint')).map(c=>c.innerText).join(' ').trim().toLowerCase();
                        let ansStr = dz.dataset.ans.toLowerCase();
                        if(userStr === ansStr) { 
                            score++; 
                            dz.classList.add('correct-input');
                        }
                        else { 
                            dz.classList.add('incorrect-input'); 
                        }
                        dz.querySelectorAll('.draggable-word').forEach(w => w.draggable = false);
                        document.querySelectorAll(`#act-7 .word-bank .draggable-word`).forEach(w => w.draggable = false);
                    });
                    break;
                case 8:
                    const txtInputs = document.querySelectorAll('.act8-input');
                    const mcqGroups = document.querySelectorAll('.act8-mcq-group');
                    total = txtInputs.length + mcqGroups.length;
                    
                    txtInputs.forEach(inp => {
                        if(inp.value.trim().toLowerCase() === inp.dataset.ans) { score++; markElement(inp, true); }
                        else { markElement(inp, false); inp.value = inp.dataset.ans; }
                    });

                    mcqGroups.forEach(group => {
                        const checked = group.querySelector('input:checked');
                        const ans = group.dataset.ans;
                        group.querySelectorAll('input').forEach(r => r.disabled = true);
                        if(checked && checked.value === ans) {
                            score++;
                            checked.parentElement.classList.add('correct-input');
                        } else {
                            if(checked) checked.parentElement.classList.add('incorrect-input');
                            group.querySelector(`input[value="${ans}"]`).parentElement.classList.add('correct-input');
                        }
                    });
                    break;
                case 9:
                    total = data.act9.length;
                    document.querySelectorAll('.act9-input').forEach(inp => {
                        if(inp.value.trim().toLowerCase() === inp.dataset.ans) { score++; markElement(inp, true); }
                        else { markElement(inp, false); inp.value = inp.dataset.ans; }
                    });
                    break;
                case 10:
                    total = 3;
                    document.querySelectorAll('.act10-drop').forEach(drop => {
                        if(drop.children.length > 0) {
                            let droppedItem = drop.children[0];
                            droppedItem.draggable = false;
                            if(droppedItem.dataset.idx === drop.dataset.ans) {
                                score++;
                                drop.classList.add('correct-input');
                            } else {
                                drop.classList.add('incorrect-input');
                            }
                        } else {
                            drop.classList.add('incorrect-input');
                        }
                    });
                    document.querySelectorAll('.act10-draggable').forEach(d => d.draggable = false);
                    break;
                case 11:
                    showToast("Remember to check for spelling, punctuation, grammar, and capitalization!");
                    const text = document.getElementById('act11-text');
                    total = 1;
                    if(text.value.trim().length > 20) { score=1; markElement(text, true); }
                    else { markElement(text, false); }
                    break;
            }

            let percentage = total > 0 ? (score / total) * 100 : 0;
            activityScores[actNum] = percentage;
            if(btn) btn.innerText = `Score: ${Math.round(percentage)}%`;
            if(btn) btn.classList.replace('bg-emerald-500', 'bg-slate-600');
        };

        const submitWork = () => {
            const name = document.getElementById('student-name').value.trim();
            if(!name) { showToast("Please enter your name at the top before submitting."); window.scrollTo(0,0); return; }

            for(let i=1; i<=totalActivities; i++) {
                if(activityScores[i] === null) checkAnswers(i);
            }

            document.getElementById('student-info').classList.add('hidden');
            document.getElementById('activities-wrapper').classList.add('hidden');
            const resSection = document.getElementById('results-section');
            resSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            let totalPerc = 0;
            let count = 0;
            let chartLabels = [];
            let chartData = [];
            let bgColors = [];

            for(let i=1; i<=totalActivities; i++) {
                if(i === 6) continue; 
                totalPerc += activityScores[i];
                count++;
                chartLabels.push(`Act ${i}`);
                chartData.push(activityScores[i]);
                
                let s = activityScores[i];
                if(s >= 80) bgColors.push('rgba(34, 197, 94, 0.8)'); 
                else if(s >= 60) bgColors.push('rgba(234, 179, 8, 0.8)'); 
                else bgColors.push('rgba(239, 68, 68, 0.8)'); 
            }

            let finalScore = totalPerc / count;
            document.getElementById('final-score-display').innerText = `${Math.round(finalScore)}%`;

            const ctx = document.getElementById('resultsChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Score per Activity (%)',
                        data: chartData,
                        backgroundColor: bgColors,
                        borderColor: bgColors.map(c => c.replace('0.8', '1')),
                        borderWidth: 2,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            max: 100,
                            grid: { color: 'rgba(156, 163, 175, 0.2)' }
                        },
                        x: { grid: { display: false } }
                    },
                    plugins: { 
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) { return context.parsed.y + '%'; }
                            }
                        }
                    }
                }
            });

            let fb = document.getElementById('overall-feedback');
            if(finalScore >= 90) fb.innerHTML = `<span class="text-green-600 dark:text-green-400">Excellent job, ${name}!</span> You have a fantastic understanding of movie vocabulary and grammar.`;
            else if(finalScore >= 70) fb.innerHTML = `<span class="text-yellow-600 dark:text-yellow-400">Good work, ${name}.</span> You grasp most concepts well, but there is room for review.`;
            else fb.innerHTML = `<span class="text-red-600 dark:text-red-400">Keep practicing, ${name}.</span> Reviewing vocabulary and grammar rules will help you improve.`;

            const recs = [
                { cond: activityScores[1] < 100, text: "Practice taking brief notes while listening to native speakers to catch main ideas quickly." },
                { cond: activityScores[4] < 80, text: "Review regular and irregular past tense verbs. Write 5 daily activities in the past tense." },
                { cond: activityScores[5] < 80, text: "Focus on conversational flow. Try reading dialogues aloud with a partner." },
                { cond: activityScores[7] < 80, text: "Review sentence structure and word order (Subject + Verb + Adjective + Noun)." },
                { cond: activityScores[8] < 80, text: "Read short stories in English to improve using context clues for missing words." },
                { cond: activityScores[9] < 100, text: "Create flashcards for common prefixes (un-, re-) and suffixes (-ful, -less)." },
                { cond: activityScores[10] < 100, text: "Practice identifying transition words to understand the logical flow of paragraphs." },
                { cond: activityScores[11] < 100, text: "Write short descriptive emails to a friend once a week using new movie adjectives." }
            ];

            let recHtml = '';
            let recCount = 0;
            recs.forEach(r => {
                if(r.cond && recCount < 8) {
                    recHtml += `<li class="flex items-start gap-4 p-3 bg-white dark:bg-slate-700/50 rounded-lg shadow-sm border border-slate-100 dark:border-slate-600"><i class="fa-solid fa-star text-amber-500 mt-1"></i> <span>${r.text}</span></li>`;
                    recCount++;
                }
            });
            if(recCount < 8) {
                const generic = [
                    "Watch English movies with English subtitles instead of dubbing.",
                    "Practice pronouncing new adjectives out loud in front of a mirror.",
                    "Read movie reviews online to see how critics describe films."
                ];
                generic.forEach(g => {
                    if(recCount < 8) {
                        recHtml += `<li class="flex items-start gap-4 p-3 bg-white dark:bg-slate-700/50 rounded-lg shadow-sm border border-slate-100 dark:border-slate-600"><i class="fa-solid fa-star text-amber-500 mt-1"></i> <span>${g}</span></li>`;
                        recCount++;
                    }
                });
            }
            document.getElementById('recommendations-list').innerHTML = recHtml;
        };

        window.onload = () => {
            generateUI();
            initAct5Logic();
            initPuzzle();
            navigate(0); 
        };
    </script>
</body>
</html>
